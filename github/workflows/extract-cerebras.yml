name: Extract IPO filing — Cerebras

# Manual trigger only. Click "Run workflow" from the Actions tab.
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install reportlab Pillow

      - name: Install Node deps (skip Chromium download)
        working-directory: research/research/manus-handoff
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Run pipeline (v2 only, no DALL-E)
        working-directory: research/research/manus-handoff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
        run: |
          mkdir -p out/cbrs
          node run-pipeline.js \
            --s1File samples/cerebras-s1-text.txt \
            --company "Cerebras Systems Inc." \
            --ticker CBRS \
            --filingDate "June 17, 2024" \
            --editor "Alexandre Villela" \
            --skipImage \
            --v2only \
            --outDir out/cbrs

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebras-extraction
          path: research/research/manus-handoff/out/cbrs/
          if-no-files-found: warn
