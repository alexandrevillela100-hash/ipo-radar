name: Extract IPO filing

# Run from the Actions tab. Click "Run workflow" → fill in the four fields →
# the pipeline fetches the S-1 from EDGAR, asks Claude for v2 JSON, and
# renders an initiation report (HTML + PDF) as a downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      edgar_url:
        description: 'EDGAR S-1 URL (the .htm document, not the index page)'
        required: true
        type: string
      company:
        description: 'Company name (e.g., "Cerebras Systems Inc.")'
        required: true
        type: string
      ticker:
        description: 'Ticker (proposed, e.g., CBRS)'
        required: true
        type: string
      filing_date:
        description: 'Filing date (e.g., "June 17, 2024")'
        required: true
        type: string
      exchange:
        description: 'Exchange (default: NYSE (proposed))'
        required: false
        type: string
        default: 'NYSE (proposed)'
      industry:
        description: 'Industry (free text, e.g., "AI Compute Hardware")'
        required: false
        type: string
        default: 'Unclassified'

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        # cairosvg is kept as a fallback in case OPENAI_API_KEY is missing
        # and the pipeline drops back to Claude-generated SVGs (which
        # ReportLab can't read natively). libcairo2 is preinstalled on
        # ubuntu-latest; we just install the Python binding.
        run: pip install reportlab Pillow cairosvg

      - name: Install Node deps (skip Chromium download)
        working-directory: research/research/manus-handoff
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Compute lowercase ticker
        id: vars
        run: echo "ticker_lc=$(echo '${{ inputs.ticker }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Run pipeline (v2, fetch from EDGAR)
        working-directory: research/research/manus-handoff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
          # OPENAI_API_KEY drives DALL-E 3 hero + body image generation.
          # If it's absent the pipeline falls back to Claude SVGs (svg mode).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: dall-e-3
          OPENAI_QUALITY: standard
          OPENAI_SIZE: 1792x1024
          # SEC requires a real User-Agent with contact email, otherwise it 403s.
          SEC_USER_AGENT: 'IPO Radar research@velociaventures.com'
        run: |
          mkdir -p out/${{ steps.vars.outputs.ticker_lc }}
          node run-pipeline.js \
            --url "${{ inputs.edgar_url }}" \
            --company "${{ inputs.company }}" \
            --ticker "${{ inputs.ticker }}" \
            --exchange "${{ inputs.exchange }}" \
            --industry "${{ inputs.industry }}" \
            --filingDate "${{ inputs.filing_date }}" \
            --editor "Alexandre Villela" \
            --dalleImages \
            --v2only \
            --outDir out/${{ steps.vars.outputs.ticker_lc }}

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ticker }}-extraction
          path: research/research/manus-handoff/out/${{ steps.vars.outputs.ticker_lc }}/
          if-no-files-found: warn
